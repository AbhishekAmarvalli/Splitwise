services:
  # Backend API + Frontend (serves built frontend in production)
  - type: web
    name: splitwise-backend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: splitwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
        value: ""

  # MySQL database
  - type: mysql
    name: splitwise-db
    plan: free
    database: splitwise
